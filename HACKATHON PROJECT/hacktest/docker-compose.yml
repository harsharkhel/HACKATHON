services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hackpreview
      POSTGRES_USER: hackpreview
      POSTGRES_PASSWORD: hackpreview
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackpreview -d hackpreview"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://hackpreview:hackpreview@postgres:5432/hackpreview
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOW_HTTP_TARGETS: ${ALLOW_HTTP_TARGETS:-false}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
